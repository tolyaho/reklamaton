name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (offline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reklamaton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reklamaton/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors, undefined names, unused code)
        run: ruff check --no-cache .
      - name: Tests (no API key; model calls go to in-process fakes)
        env:
          OPENAI_API_KEY: ""
        run: python -m pytest -q
      - name: Dependency audit (informational)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "::warning::pip-audit reported advisories for reklamaton/requirements.txt"

  original-frontend:
    name: Original frontend (my-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  showcase:
    name: Showcase (unit + browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against the production build
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: showcase/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (working tree)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner
